<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131c">
<title>IchthyoGen — procedural fish generator</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
{{CSS}}</style>
<script>
/* early global error overlay (works even if the module fails to import) */
window.__fgShowError=function(msg){var o=document.getElementById('errOverlay'),t=document.getElementById('errText');if(o&&t){t.textContent+=(t.textContent?'\n\n':'')+msg;o.classList.remove('hidden');}else{console.error(msg);}};
window.addEventListener('error',function(e){window.__fgShowError((e.message||'Error')+'\n'+(e.filename||'')+':'+(e.lineno||'')+(e.error&&e.error.stack?'\n'+e.error.stack:''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.__fgShowError('Unhandled rejection: '+(r&&r.stack?r.stack:String(r)));});
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<header class="bar top">
  <div class="brand">IchthyoGen<small>Anatomy Engine / 03</small></div>
  <select id="selHabitat" title="Habitat" aria-label="Habitat"></select>
  <button id="btnRandom" class="primary" title="Invent a never-before-seen species that is coherent and adapted to the selected habitat">Random</button>
  <select id="selNiche" title="Niche" aria-label="Ecological niche"></select>
  <select id="selClade" title="Clade" aria-label="Evolutionary clade"></select>
  <select id="selSpecies" title="Species card" aria-label="Reference species"></select>
  <select id="selMix" title="Second parent: any species, niche archetype or invented fish to cross with the current fish" aria-label="Mix with"></select>
  <input id="mixRatio" type="range" min="10" max="90" value="50" title="Share of the second parent (10-90%)" aria-label="Mix ratio" style="width:60px;padding:0;min-height:28px;border:0;background:none">
  <button id="btnMix" class="primary" title="Cross the current fish with the selected parent and adapt the offspring to the selected habitat">Mix</button>
  <input id="seed" type="text" placeholder="seed" style="width:90px" title="Seed" aria-label="Generation seed">
  <button id="btnGenerate">Generate</button>
  <input id="nameInput" type="text" placeholder="Name a creature… e.g. yellowfin tuna" style="width:230px;max-width:52vw" aria-label="Creature name or description">
  <button id="btnConvert" class="primary">Convert</button>
</header>
<div id="hud"><div id="fishName">…</div><div id="fishSci"></div><div id="fishTags"></div><div id="stats"></div></div>
<nav class="bar bottom">
  <button data-act="generate">New Fish</button>
  <button data-act="discover" title="Invent a coherent species that has never existed, adapted to the current habitat">Discover</button>
  <select id="selMutation" title="Which anatomical module to evolve" aria-label="Mutation target">
    <option value="auto">Mutation: guided</option>
    <option value="drift">Adaptive drift</option>
    <option value="donor">Gene flow (from Mix parent)</option>
    <option value="habitat">Adapt to habitat (gradual)</option>
    <option value="innovate">Innovate: new organ</option>
    <option value="speed">Streamlining</option>
    <option value="agility">Body depth</option>
    <option value="finShape">Fin silhouette</option>
    <option value="display">Fin growth</option>
    <option value="tail">Tail propulsion</option>
    <option value="feeding">Head and jaw</option>
    <option value="shelter">Elongation</option>
  </select>
  <button data-act="mutate" id="btnMutate">Mutate</button>
  <button data-act="undo" id="btnUndo" title="Restore the previous genome">Undo</button>
  <button data-act="breed" title="Constrained virtual crossover with the previous fish">Breed</button>
  <button data-act="school" id="btnSchool">School</button>
  <button data-act="mode" id="btnMode">Studio</button>
  <button data-tab="mix" id="btnMixTab">Hybrid Lab</button>
  <button data-tab="evo" id="btnEvoTab">Evolution</button>
  <button data-tab="god" id="btnGod">God Mode</button>
  <button data-tab="inspect">Genome</button>
  <button data-tab="tree">Tree</button>
  <button data-tab="gallery">Gallery</button>
  <button data-tab="text">Text</button>
  <button data-tab="export">Export</button>
  <button data-tab="debug">Debug</button>
  <button data-tab="tests">Tests</button>
  <button data-tab="help">Guide</button>
</nav>
<section id="sheet" class="hidden" aria-label="Fish creation tools"><div class="sheet-head"><span id="sheetTitle"></span><button id="sheetClose" class="sm" aria-label="Close tools">Close</button></div><div id="sheetBody"></div></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="errOverlay" class="hidden"><h3>Something went wrong</h3><pre id="errText"></pre><button id="errClose">Dismiss</button></div>

<script type="module">
{{APP}}</script>
</body>
</html>
